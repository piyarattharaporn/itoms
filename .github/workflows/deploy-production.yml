name: Deploy Production

# Production is intentionally manual until the GitHub production environment
# has required reviewers configured. This prevents the first repository push
# from changing the live system unexpectedly.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to itoms-v2
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: production
      url: https://itoms-v2.web.app
    env:
      VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
      VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
      VITE_FIREBASE_PROJECT_ID: itoms-v2
      VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}
      VITE_FIREBASE_APPCHECK_SITE_KEY: ${{ vars.VITE_FIREBASE_APPCHECK_SITE_KEY }}
      VITE_USE_FIREBASE_EMULATORS: 'false'
      VITE_ENABLE_APP_CHECK: 'true'
      VITE_ENABLE_USAGE_TELEMETRY: 'false'
      VITE_ENABLE_TRUSTED_BACKEND: 'false'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Write production public configuration
        run: |
          {
            printf 'VITE_FIREBASE_API_KEY=%s\n' "$VITE_FIREBASE_API_KEY"
            printf 'VITE_FIREBASE_AUTH_DOMAIN=%s\n' "$VITE_FIREBASE_AUTH_DOMAIN"
            printf 'VITE_FIREBASE_PROJECT_ID=%s\n' "$VITE_FIREBASE_PROJECT_ID"
            printf 'VITE_FIREBASE_APP_ID=%s\n' "$VITE_FIREBASE_APP_ID"
            printf 'VITE_FIREBASE_APPCHECK_SITE_KEY=%s\n' "$VITE_FIREBASE_APPCHECK_SITE_KEY"
            printf 'VITE_USE_FIREBASE_EMULATORS=%s\n' "$VITE_USE_FIREBASE_EMULATORS"
            printf 'VITE_ENABLE_APP_CHECK=%s\n' "$VITE_ENABLE_APP_CHECK"
            printf 'VITE_ENABLE_USAGE_TELEMETRY=%s\n' "$VITE_ENABLE_USAGE_TELEMETRY"
            printf 'VITE_ENABLE_TRUSTED_BACKEND=%s\n' "$VITE_ENABLE_TRUSTED_BACKEND"
          } > .env.production

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Deploy Production
        run: npx -y firebase-tools@latest deploy --config firebase.json --project itoms-v2 --only hosting,firestore,auth
