name: Deploy UAT

on:
  push:
    branches: [uat]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-uat
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy to itoms-uat
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: uat
      url: https://itoms-uat.web.app
    env:
      VITE_APP_ENV: uat
      VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
      VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
      VITE_FIREBASE_PROJECT_ID: itoms-uat
      VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}
      VITE_USE_FIREBASE_EMULATORS: 'false'
      VITE_ENABLE_APP_CHECK: 'false'
      VITE_ENABLE_USAGE_TELEMETRY: 'false'
      VITE_ENABLE_TRUSTED_BACKEND: 'false'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Write UAT public configuration
        run: |
          {
            printf 'VITE_APP_ENV=%s\n' "$VITE_APP_ENV"
            printf 'VITE_FIREBASE_API_KEY=%s\n' "$VITE_FIREBASE_API_KEY"
            printf 'VITE_FIREBASE_AUTH_DOMAIN=%s\n' "$VITE_FIREBASE_AUTH_DOMAIN"
            printf 'VITE_FIREBASE_PROJECT_ID=%s\n' "$VITE_FIREBASE_PROJECT_ID"
            printf 'VITE_FIREBASE_APP_ID=%s\n' "$VITE_FIREBASE_APP_ID"
            printf 'VITE_USE_FIREBASE_EMULATORS=%s\n' "$VITE_USE_FIREBASE_EMULATORS"
            printf 'VITE_ENABLE_APP_CHECK=%s\n' "$VITE_ENABLE_APP_CHECK"
            printf 'VITE_ENABLE_USAGE_TELEMETRY=%s\n' "$VITE_ENABLE_USAGE_TELEMETRY"
            printf 'VITE_ENABLE_TRUSTED_BACKEND=%s\n' "$VITE_ENABLE_TRUSTED_BACKEND"
          } > .env.uat

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Deploy UAT
        run: npm run deploy:uat
